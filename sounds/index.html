<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>工具</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#f5f6fa;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px;overflow:hidden}.app{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.06);width:100%;max-width:420px;padding:24px 20px 20px;position:relative}.title{font-size:22px;font-weight:600;color:#1a1a2e;margin-bottom:16px;text-align:center}.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.btn-group .btn{padding:12px 0;border:none;border-radius:3px;font-size:13px;font-weight:500;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1);background:#f0f2f5;color:#2d2d44;outline:none}.btn-group .btn:active{transform:scale(.92)}.btn-group .btn.primary{background:#fff;color:#000;border:1px solid #ddd}.back-btn{position:fixed;top:20px;left:8px;padding:10px 16px;border:none;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;background:#f5f6fa;color:#000;transition:transform .15s cubic-bezier(.34,1.56,.64,1);z-index:999;display:none;align-items:center;gap:6px;outline:none}.back-btn:active{transform:scale(.92)}.back-btn svg{width:20px;height:20px;stroke:#000;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.page-container{position:relative;overflow:hidden}.page{display:none;animation-duration:.35s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.25,.46,.45,.94)}.page.active{display:block}.page.slide-in{animation-name:slideIn}.page.slide-out{animation-name:slideOut}@keyframes slideIn{0%{transform:translateX(100%);opacity:.5}100%{transform:translateX(0);opacity:1}}@keyframes slideOut{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-30%);opacity:0}}.work-area{margin-top:12px}.work-area .file-label{display:block;padding:14px 0;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:4px;font-size:14px;color:#475569;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1);text-align:center;margin-bottom:12px;outline:none}.work-area .file-label:active{transform:scale(.97)}.work-area .file-label input{display:none}.work-area .btn-row{display:flex;gap:10px;margin-top:12px}.work-area .btn-row .btn{flex:1;padding:12px 0;border:none;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1);background:#f0f2f5;color:#2d2d44;outline:none}.work-area .btn-row .btn:active{transform:scale(.92)}.work-area .btn-row .btn.primary{background:#2d2d44;color:#fff}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) scale(.8);background:rgba(0,0,0,.82);color:#fff;padding:10px 24px;border-radius:4px;font-size:14px;z-index:1000;opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.loading-mask{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.45);z-index:9999;display:none;justify-content:center;align-items:center;backdrop-filter:blur(2px)}.loading-mask.show{display:flex}.loading-box{background:#fff;border-radius:4px;padding:30px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}@keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}.loading-spinner{width:44px;height:44px;transform:translateZ(0);backface-visibility:hidden}.loading-spinner svg{width:100%;height:100%;display:block;transform:translateZ(0)}.loading-spinner .e{transform:rotate(-90deg);transform-origin:50% 50%}.loading-spinner .f{transform:rotate(-88deg);transform-origin:50% 50%}.loading-spinner .g{animation:h 1.7s linear infinite;transform-origin:50% 50%;will-change:transform;transform:translateZ(0);backface-visibility:hidden}.loading-spinner .i{fill:none;stroke:#2d2d44;stroke-width:6.5;stroke-linecap:butt;transform-origin:50% 50%;animation:j 1.7s cubic-bezier(.4,0,.5,1) infinite;will-change:stroke-dasharray,stroke-dashoffset;transform:translateZ(0)}@keyframes h{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}@keyframes j{0%{stroke-dasharray:10 178.5;stroke-dashoffset:0}40%{stroke-dasharray:120 68.5;stroke-dashoffset:-60}48%{stroke-dasharray:120 68.5;stroke-dashoffset:-70}100%{stroke-dasharray:10 178.5;stroke-dashoffset:-188.5}}.loading-text{font-size:15px;color:#2d2d44;font-weight:500}.dl-bar-wrap{width:200px;height:8px;background:#f0f2f5;border-radius:0;overflow:hidden}.dl-bar{height:100%;width:0%;background:#2d2d44;border-radius:0;transition:width .2s linear}.dl-pct{font-size:13px;color:#888;text-align:center;font-variant-numeric:tabular-nums}</style></head><body><div class="app"><div class="title">工具</div><div class="page-container"><div class="page active" id="mainPage"><div class="btn-group" id="mainButtons"><button class="btn primary" data-mode="wavToMp3">WAV转MP3</button><button class="btn primary" data-mode="mp3ToWav">MP3转WAV</button><button class="btn primary" data-mode="wavToAac">WAV转AAC</button><button class="btn primary" data-mode="wavToOgg">WAV转OGG</button><button class="btn primary" data-mode="aacToWav">AAC转WAV</button><button class="btn primary" data-mode="oggToWav">OGG转WAV</button></div></div><div class="page" id="workPage"><div class="work-area" id="workAreaWavToMp3" style="display:none"><label class="file-label" id="fileLabelWavToMp3">选择WAV文件<input type="file" id="fileInputWavToMp3"></label><div class="btn-row"><button class="btn primary" id="processBtnWavToMp3">处理</button><button class="btn" id="clearBtnWavToMp3">清空</button></div></div><div class="work-area" id="workAreaMp3ToWav" style="display:none"><label class="file-label" id="fileLabelMp3ToWav">选择MP3文件<input type="file" id="fileInputMp3ToWav"></label><div class="btn-row"><button class="btn primary" id="processBtnMp3ToWav">处理</button><button class="btn" id="clearBtnMp3ToWav">清空</button></div></div><div class="work-area" id="workAreaWavToAac" style="display:none"><label class="file-label" id="fileLabelWavToAac">选择WAV文件<input type="file" id="fileInputWavToAac"></label><div class="btn-row"><button class="btn primary" id="processBtnWavToAac">处理</button><button class="btn" id="clearBtnWavToAac">清空</button></div></div><div class="work-area" id="workAreaWavToOgg" style="display:none"><label class="file-label" id="fileLabelWavToOgg">选择WAV文件<input type="file" id="fileInputWavToOgg"></label><div class="btn-row"><button class="btn primary" id="processBtnWavToOgg">处理</button><button class="btn" id="clearBtnWavToOgg">清空</button></div></div><div class="work-area" id="workAreaAacToWav" style="display:none"><label class="file-label" id="fileLabelAacToWav">选择AAC文件<input type="file" id="fileInputAacToWav"></label><div class="btn-row"><button class="btn primary" id="processBtnAacToWav">处理</button><button class="btn" id="clearBtnAacToWav">清空</button></div></div><div class="work-area" id="workAreaOggToWav" style="display:none"><label class="file-label" id="fileLabelOggToWav">选择OGG文件<input type="file" id="fileInputOggToWav"></label><div class="btn-row"><button class="btn primary" id="processBtnOggToWav">处理</button><button class="btn" id="clearBtnOggToWav">清空</button></div></div></div></div></div><button class="back-btn" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>返回</button><div class="toast" id="toast"></div><div class="loading-mask" id="loadingMask"><div class="loading-box"><div class="loading-spinner"><svg viewBox="0 0 100 100"><g class="e"><g class="f"><g class="g"><circle class="i" cx="50" cy="50" r="30"></circle></g></g></g></svg></div><div class="loading-text">正在加载引擎... 30MB</div><div class="dl-bar-wrap" id="progressWrap" style="display:none"><div class="dl-bar" id="dlBar"></div></div><div class="dl-pct" id="dlPct" style="display:none">0%</div></div></div><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script><script src="sound.js"></script></body></html>
